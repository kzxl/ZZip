name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Ztar.slnx

      - name: Build
        run: dotnet build Ztar.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Ztar.Tests/Ztar.Tests.csproj -c Release --no-build --verbosity normal
